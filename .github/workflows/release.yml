name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            build_args: --mac
          - platform: windows-latest
            build_args: --win

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app
        run: ELECTRON_RUN_AS_NODE= npx electron-vite build && npx electron-builder ${{ matrix.build_args }} --publish never
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: ""

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Danmaku Hub ${{ github.ref_name }}
          body: |
            查看下方 Assets 下载对应平台安装包。
          draft: true
          prerelease: false
          files: |
            dist-electron-app/*.dmg
            dist-electron-app/*.exe
            dist-electron-app/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
